<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Frontend Mentor | Contact form</title>
  <link rel="icon" type="image/png" sizes="32x32" href="./src/assets/images/favicon-32x32.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Karla:ital,wght@0,200..800;1,200..800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./src/css/main.scss">
</head>
<body>
  <main class="container">
    <form class="form" id="form">
      <h1 class="title">Contact Us</h1>
      <div class="row">
        <div class="input-group" id="inputGroupFirstName">
          <label for="firstName">First Name *</label>
          <input type="text" id="firstName" name="firstName">
          <span class="error-message">This field is required</span>
        </div>
        <div class="input-group" id="inputGroupLastName">
          <label for="lastName">Last Name *</label>
          <input type="text" id="lastName" name="lastName">
          <span class="error-message">This field is required</span>
        </div>
      </div>
      <div class="input-group" id="inputGroupEmail">
        <label for="email">Email Address *</label>
        <!-- Please enter a valid email address -->
        <input type="email" id="email" name="email">
        <span class="error-message">This field is required</span>
      </div>

      <div class="input-group" id="inputGroupQueryType">
        <label for="">Query Type *</label>
        <div class="row">
          <label class="input-group--radio" for="generalEnquiry">
            <input type="radio" name="queryType" id="generalEnquiry" value="generalEnquiry">
            <span>General Enquiry</span>
          </label>
          
          <label class="input-group--radio" for="supportRequest">
            <input type="radio" name="queryType" id="supportRequest" value="supportRequest">
            <span>Support Request</span>
          </label>
        </div>
        <span class="error-message">Please select a query type</span>
      </div>

      <div class="input-group" id="inputGroupMessage">
        <label for="message">Message *</label>
        <textarea class="message-box" name="message" id="message"></textarea>
        <span class="error-message">This field is required</span>
      </div>

      <div id="checkboxGroup">
        <label class="input-group--checkbox" for="checkConsent">
          <input type="checkbox" name="checkConsent" id="checkConsent">
          <span>I consent to being contacted by the team *</span>
        </label>
        <span class="error-message">To submit this form, please consent to being contacted</span>
      </div>

      <button type="submit" class="btn-primary">Submit</button>
    </form>
  </main>

  <!-- Message Sent!
  Thanks for completing the form. We'll be in touch soon! -->
  
  <footer class="attribution">
    <p>Challenge by <a href="https://www.frontendmentor.io/challenges/contact-form--G-hYlqKJj">Frontend Mentor</a></p>
    <div class="bullet"></div>
    <p>Coded by <a href="https://www.frontendmentor.io/profile/otaviozerotwo">Otávio Cardoso</a></p>
  </footer>

  <script src="src/js/main.js" type="module"></script>
</body>
</html>
