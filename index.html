<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Frontend Mentor | Contact form</title>
  <link rel="icon" type="image/png" sizes="32x32" href="./src/assets/images/favicon-32x32.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Karla:ital,wght@0,200..800;1,200..800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./src/css/main.scss">
</head>
<body>
  <main class="container">
    <form class="form" id="form">
      <h1 class="title">Contact Us</h1>
      <div class="row">
        <div class="input-group">
          <label for="firstName">First Name *</label>
          <input 
            type="text" 
            autocomplete="given-name" 
            id="firstName" 
            name="firstName"
            aria-describedby="firstNameError"  
          >
          <span 
            class="error-message" 
            id="firstNameError" 
            role="alert" 
            hidden
          ></span>
        </div>
        <div class="input-group">
          <label for="lastName">Last Name *</label>
          <input 
            type="text" 
            autocomplete="family-name" 
            id="lastName" 
            name="lastName"
            aria-describedby="lastNameError"  
          >
          <span 
            class="error-message"
            id="lastNameError"
            role="alert"
            hidden  
          ></span>
        </div>
      </div>
      <div class="input-group">
        <label for="email">Email Address *</label>
        <input 
          type="email" 
          autocomplete="email" 
          id="email" 
          name="email"
          aria-describedby="emailError"
        >
        <span 
          class="error-message"
          id="emailError"
          role="alert"
          hidden
        ></span>
      </div>

      <fieldset class="input-group" id="queryType">
        <legend>Query Type *</legend>
        <div class="row">
          <label class="input-group--radio" for="generalEnquiry">
            <input 
              type="radio" 
              name="queryType" 
              id="generalEnquiry"
              aria-describedby="queryTypeError"
              value="generalEnquiry"
            >
            <span>General Enquiry</span>
          </label>
          
          <label class="input-group--radio" for="supportRequest">
            <input 
              type="radio" 
              name="queryType" 
              id="supportRequest"
              aria-describedby="queryTypeError"
              value="supportRequest"
            >
            <span>Support Request</span>
          </label>
        </div>
        <span 
          class="error-message" 
          id="queryTypeError"
          role="alert"
          hidden
        ></span>
      </fieldset>

      <div class="input-group">
        <label for="message">Message *</label>
        <textarea 
          class="message-box" 
          name="message" 
          id="message"
          aria-describedby="messageError"
        ></textarea>
        <span 
          class="error-message"
          id="messageError"
          role="alert"
          hidden
        ></span>
      </div>

      <div>
        <label class="input-group--checkbox" for="checkConsent">
          <input 
            type="checkbox" 
            id="checkConsent"
            name="checkConsent"
            aria-describedby="checkConsentError"
          >
          <span>I consent to being contacted by the team *</span>
        </label>
        <span 
          class="error-message"
          id="checkConsentError"
          role="alert"
          hidden
        ></span>
      </div>

      <button type="submit" class="btn">Submit</button>
    </form>
  </main>
  
  <footer class="attribution">
    <p>Challenge by <a href="https://www.frontendmentor.io/challenges/contact-form--G-hYlqKJj" target="_blank" rel="noreferrer noopener">Frontend Mentor</a></p>
    <div class="bullet"></div>
    <p>Coded by <a href="https://www.frontendmentor.io/profile/otaviozerotwo" target="_blank" rel="noreferrer noopener">Otávio Cardoso</a></p>
  </footer>

  <script src="src/js/main.js" type="module"></script>
</body>
</html>
